{{- if not .Values.videoStream.streamUrl }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ppe-compliance-monitor.fullname" . }}-video-stream
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: video-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ppe-compliance-monitor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: video-stream
  template:
    metadata:
      labels:
        {{- include "ppe-compliance-monitor.labels" . | nindent 8 }}
        app.kubernetes.io/component: video-stream
    spec:
      initContainers:
        - name: download-video
          image: {{ .Values.jobImages.python | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              export HOME=/tmp
              pip install --no-cache-dir -q boto3
              python - <<'PY'
              import os, time
              import boto3
              from botocore.client import Config

              endpoint = os.environ["AWS_ENDPOINT_URL"]
              bucket = os.environ["VIDEO_BUCKET"]
              key = os.environ["VIDEO_KEY"]
              dest = "/data/video.mp4"
              print("[download-video] endpoint=" + endpoint)
              print("[download-video] source object: s3://" + bucket + "/" + key)

              def client():
                  return boto3.client(
                      "s3",
                      endpoint_url=endpoint,
                      aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                      aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                      region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
                      config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
                  )

              s3 = None
              last = None
              for attempt in range(1, 61):
                  try:
                      s3 = client()
                      s3.head_object(Bucket=bucket, Key=key)
                      break
                  except Exception as exc:
                      last = exc
                      print("[download-video] object not ready (attempt " + str(attempt) + "/60): " + str(exc))
                      time.sleep(5)
              else:
                  raise SystemExit("[download-video] object missing or storage unreachable: " + str(last))

              print("[download-video] copying to /data/video.mp4")
              s3.download_file(bucket, key, dest)
              size = os.path.getsize(dest)
              if size <= 0:
                  raise SystemExit("[download-video] ERROR: /data/video.mp4 missing or empty")
              print("[download-video] ok size_bytes=" + str(size))
              PY
          env:
            - name: HOME
              value: /tmp
            {{- include "ppe-compliance-monitor.s3Env" . | nindent 12 }}
            - name: VIDEO_BUCKET
              value: {{ .Values.storage.video.bucket | quote }}
            - name: VIDEO_KEY
              value: {{ .Values.storage.video.key | quote }}
          volumeMounts:
            - name: video-data
              mountPath: /data
      containers:
        - name: mediamtx
          image: "{{ .Values.videoStream.image.repository }}:{{ .Values.videoStream.image.tag }}"
          imagePullPolicy: {{ .Values.videoStream.image.pullPolicy }}
          {{- $mtx := .Values.videoStream.mediamtx | default dict }}
          {{- $wq := $mtx.writeQueueSize | default "" }}
          {{- $ur := $mtx.udpReadBufferSize | default "" }}
          {{- if or $wq $ur }}
          env:
            {{- if $wq }}
            - name: MTX_WRITEQUEUESIZE
              value: {{ $wq | quote }}
            {{- end }}
            {{- if $ur }}
            - name: MTX_UDPREADBUFFERSIZE
              value: {{ $ur | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.videoStream.port }}
              name: rtsp
        - name: ffmpeg
          image: docker.io/linuxserver/ffmpeg:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VIDEO_SRC_HINT
              value: "s3://{{ .Values.storage.video.bucket }}/{{ .Values.storage.video.key }}"
          command:
            - /bin/sh
            - -c
            - |
              echo "[ffmpeg] listing /data (from download-video init):"
              ls -la /data 2>&1 || true
              if [ ! -f /data/video.mp4 ]; then
                echo "[ffmpeg] ERROR: /data/video.mp4 not found — check download-video init logs and object ${VIDEO_SRC_HINT:-}"
                exit 1
              fi
              if [ ! -s /data/video.mp4 ]; then
                echo "[ffmpeg] ERROR: /data/video.mp4 is empty"
                exit 1
              fi
              stat /data/video.mp4 2>&1 || true
              echo "Waiting for MediaMTX to start..."
              sleep 5
              echo "Starting FFmpeg stream"
              exec ffmpeg -re -stream_loop -1 -i /data/video.mp4 -c copy -f rtsp rtsp://localhost:{{ .Values.videoStream.port }}/{{ .Values.videoStream.path }}
          volumeMounts:
            - name: video-data
              mountPath: /data
      volumes:
        - name: video-data
          emptyDir: {}
{{- end }}
