{{- if .Values.s3Credentials.create }}
{{- $_ := required "s3Credentials.accessKeyId is required (set it in values-secrets.yaml or --set)" .Values.s3Credentials.accessKeyId }}
{{- $_ := required "s3Credentials.secretAccessKey is required (set it in values-secrets.yaml or --set)" .Values.s3Credentials.secretAccessKey }}
{{- $storage := index .Values "aws-compatible-storage" | default dict }}
{{- $auth := $storage.auth | default dict }}
{{- if $auth.enabled }}
{{- $_ := required "s3Credentials.uiUsername is required when aws-compatible-storage.auth.enabled=true" .Values.s3Credentials.uiUsername }}
{{- $_ := required "s3Credentials.uiPassword is required when aws-compatible-storage.auth.enabled=true" .Values.s3Credentials.uiPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ppe-compliance-monitor.storageSecretName" . }}
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3Credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3Credentials.secretAccessKey | quote }}
  {{- if .Values.s3Credentials.uiUsername }}
  UI_USERNAME: {{ .Values.s3Credentials.uiUsername | quote }}
  {{- end }}
  {{- if .Values.s3Credentials.uiPassword }}
  UI_PASSWORD: {{ .Values.s3Credentials.uiPassword | quote }}
  {{- end }}
{{- end }}
